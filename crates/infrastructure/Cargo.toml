[package]
name = "android-hub-infrastructure"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
android-hub-domain.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
fs2.workspace = true
libc.workspace = true
zip.workspace = true
