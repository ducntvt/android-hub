name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require matching Cargo version, main ancestry and dated changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py validate "$RELEASE_TAG"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Package and publish macOS release
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Restore Cargo dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/metrics/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock', '**/Cargo.toml') }}
      - name: Build and verify ARM64 app, ZIP and DMG
        run: |
          rustup show active-toolchain
          bash scripts/package-release.sh
      - name: Validate again and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py validate "$RELEASE_TAG" --notes "$RUNNER_TEMP/release-notes.md"
          # Existing releases are never edited or replaced. A failed lookup still
          # reaches `create`, whose API rejects duplicates instead of overwriting.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it." >&2
            exit 1
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          assets="dist/$RELEASE_TAG-macos-arm64"
          (cd "$assets" && shasum -a 256 -c SHA256SUMS)
          # Upload to a draft first; failed uploads must not publish a partial release.
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Android Hub $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}" \
            "$assets/Android-Hub-$RELEASE_TAG-macos-arm64.app.zip" \
            "$assets/Android-Hub-$RELEASE_TAG-macos-arm64.dmg" \
            "$assets/SHA256SUMS" "$assets/INSTALL.txt"
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
      - name: Clean disposable build outputs
        if: always()
        run: rm -rf dist target tools/metrics/target
