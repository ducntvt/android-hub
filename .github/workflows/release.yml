name: Source release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require matching Cargo version, main ancestry and dated changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py validate "$RELEASE_TAG"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish source release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate again and publish without binary assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py validate "$RELEASE_TAG" --notes "$RUNNER_TEMP/release-notes.md"
          # Existing releases are never edited or replaced. A failed lookup still
          # reaches `create`, whose API rejects duplicates instead of overwriting.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it." >&2
            exit 1
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "Android Hub $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
